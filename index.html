<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>skill-tree</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=DM+Sans:wght@400;500;600&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0a0c;
  --bg-panel: #0f1014;
  --bg-row: #14151a;
  --bg-row-hover: #1a1c24;
  --bg-row-selected: #1c2333;
  --border: #1e2028;
  --border-focus: #3b4d7a;
  --text: #c8ccd4;
  --text-dim: #5c6070;
  --text-bright: #e8ecf4;
  --accent: #5b8af0;
  --accent-dim: #3b5aa0;
  --accent-glow: rgba(91, 138, 240, 0.15);
  --node-khan: #f0a05b;
  --node-junyi: #5bf0a0;
  --node-metacademy: #a05bf0;
  --node-alcpl: #f05b8a;
  --node-mooccubex: #5bc8f0;
  --node-esco: #f0e05b;
  --node-assistments: #f07a5b;
  --node-csp: #8af05b;
  --node-lightcast: #f05bf0;
  --node-opensalt: #5bf0e0;
  --node-default: #7a7e8a;
}

html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overflow: hidden; }

#app { display: flex; height: 100vh; }

/* Left Panel */
#left { width: 38%; min-width: 320px; border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--bg-panel); }

#header {
  padding: 16px 20px 12px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, #12131a 0%, var(--bg-panel) 100%);
}

#header h1 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: 0.5px;
  color: var(--text-bright);
  margin-bottom: 10px;
}

#header h1 span { color: var(--accent); }

#stats {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: 0.3px;
  margin-bottom: 12px;
}

#search-box {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 8px 12px;
  color: var(--text-bright);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  outline: none;
  transition: border-color 0.2s;
}

#search-box:focus { border-color: var(--border-focus); box-shadow: 0 0 0 2px var(--accent-glow); }
#search-box::placeholder { color: var(--text-dim); }

#filters {
  padding: 8px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.filter-btn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  padding: 3px 8px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 0.2px;
}

.filter-btn:hover { border-color: var(--text-dim); color: var(--text); }
.filter-btn.active { border-color: var(--accent-dim); color: var(--accent); background: var(--accent-glow); }

#table-header {
  display: grid;
  grid-template-columns: 1fr 2fr 1fr;
  padding: 6px 20px;
  border-bottom: 1px solid var(--border);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.8px;
}

#table-wrap { flex: 1; overflow-y: auto; }
#table-wrap::-webkit-scrollbar { width: 6px; }
#table-wrap::-webkit-scrollbar-track { background: transparent; }
#table-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
#table-wrap::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

.row {
  display: grid;
  grid-template-columns: 1fr 2fr 1fr;
  padding: 6px 20px;
  border-bottom: 1px solid #111218;
  cursor: pointer;
  transition: background 0.1s;
  font-size: 12px;
  align-items: center;
}

.row:hover { background: var(--bg-row-hover); }
.row.selected { background: var(--bg-row-selected); border-left: 2px solid var(--accent); padding-left: 18px; }

.row .id {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-dim);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  padding-right: 8px;
}

.row .label {
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  padding-right: 8px;
}

.row .tags {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--text-dim);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.row.selected .label { color: var(--text-bright); }

#table-footer {
  padding: 8px 20px;
  border-top: 1px solid var(--border);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-dim);
}

/* Right Panel */
#right { flex: 1; display: flex; flex-direction: column; position: relative; }

#graph-header {
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-dim);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-panel);
  z-index: 1;
}

#graph-title { color: var(--text-bright); }
#graph-info { font-size: 10px; }

#canvas-wrap { flex: 1; position: relative; overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; }

#empty-state {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  gap: 8px;
  pointer-events: none;
}

#empty-state .icon { font-size: 48px; opacity: 0.15; margin-bottom: 8px; }

/* Legend */
#legend {
  position: absolute;
  bottom: 16px;
  left: 16px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--text-dim);
  background: rgba(10, 10, 12, 0.85);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 8px 10px;
  display: none;
  gap: 4px;
  flex-direction: column;
  backdrop-filter: blur(8px);
}

#legend.visible { display: flex; }

.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-dot { width: 6px; height: 6px; border-radius: 50%; }

/* Tooltip */
#tooltip {
  position: absolute;
  display: none;
  background: #1a1c24;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 8px 12px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-bright);
  pointer-events: none;
  z-index: 10;
  max-width: 300px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}

#tooltip .tt-id { font-size: 9px; color: var(--text-dim); margin-top: 2px; }

/* Loading */
#loading {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  z-index: 100;
  flex-direction: column;
  gap: 12px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-dim);
  font-size: 12px;
}

@keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
#loading .dot { animation: pulse 1.2s ease-in-out infinite; color: var(--accent); font-size: 24px; }
</style>
</head>
<body>
<div id="loading"><span class="dot">&bull;</span>loading viz.json</div>
<div id="app" style="display:none">
  <div id="left">
    <div id="header">
      <h1>skill<span>-</span>tree</h1>
      <div id="stats"></div>
      <input type="text" id="search-box" placeholder="search skills..." spellcheck="false" />
    </div>
    <div id="filters"></div>
    <div id="table-header"><span>source</span><span>label</span><span>tags</span></div>
    <div id="table-wrap"></div>
    <div id="table-footer"></div>
  </div>
  <div id="right">
    <div id="graph-header">
      <span id="graph-title">prereq graph</span>
      <span id="hop-controls" style="display:none">
        <button id="hop-minus" class="filter-btn" style="padding:2px 7px;font-size:12px">−</button>
        <span id="hop-label" style="margin:0 4px"></span>
        <button id="hop-plus" class="filter-btn" style="padding:2px 7px;font-size:12px">+</button>
      </span>
      <span id="graph-info"></span>
    </div>
    <div id="canvas-wrap">
      <canvas id="canvas"></canvas>
      <div id="empty-state">
        <div class="icon">&loz;</div>
        <div>select a skill to explore its prereq graph</div>
        <div style="font-size:10px;opacity:0.5">click a row in the table or search for a skill</div>
      </div>
      <div id="legend"></div>
      <div id="tooltip"></div>
    </div>
  </div>
</div>

<script>
const SOURCE_COLORS = {
  khan: '#f0a05b', junyi: '#5bf0a0', metacademy: '#a05bf0', alcpl: '#f05b8a',
  mooccubex: '#5bc8f0', esco: '#f0e05b', assistments: '#f07a5b', csp: '#8af05b',
  lightcast: '#f05bf0', opensalt: '#5bf0e0',
};

let DATA = null;
let skillMap = {};       // id -> skill
let prereqsOf = {};      // id -> [prereq_ids]
let dependentsOf = {};   // id -> [dependent_ids]
let filteredSkills = [];
let selectedId = null;
let graphNodes = [];
let graphEdges = [];
let simRunning = false;
let hoveredNode = null;
let hoverFade = 0; // 0 = no hover dimming, 1 = full hover dimming
let hoverFadeTarget = 0;
let lastFrameTime = 0;
let dragNode = null;
let panX = 0, panY = 0, zoom = 1;
let lastMouse = null;
let isPanning = false;

function sourceOf(id) { return id.split('.')[0]; }
function colorOf(id) { return SOURCE_COLORS[sourceOf(id)] || '#7a7e8a'; }

async function init() {
  const resp = await fetch('viz.json');
  DATA = await resp.json();

  for (const s of DATA.skills) {
    skillMap[s.id] = s;
    prereqsOf[s.id] = [];
    dependentsOf[s.id] = [];
  }
  for (const [sid, pid] of DATA.prereqs) {
    if (!prereqsOf[sid]) prereqsOf[sid] = [];
    if (!dependentsOf[pid]) dependentsOf[pid] = [];
    prereqsOf[sid].push(pid);
    dependentsOf[pid].push(sid);
  }

  document.getElementById('stats').textContent =
    `${DATA.skills.length} skills  /  ${DATA.prereqs.length} prereq edges`;
  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = 'flex';

  buildFilters();
  filteredSkills = DATA.skills.slice();
  renderTable();
  setupSearch();
  setupCanvas();
  showOverview();
}

// Filters
let activeFilters = new Set();

function buildFilters() {
  const counts = {};
  for (const s of DATA.skills) {
    const src = sourceOf(s.id);
    counts[src] = (counts[src] || 0) + 1;
  }
  const el = document.getElementById('filters');
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  for (const [src, n] of sorted) {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.textContent = `${src} (${n})`;
    btn.dataset.source = src;
    btn.onclick = () => {
      if (activeFilters.has(src)) { activeFilters.delete(src); btn.classList.remove('active'); }
      else { activeFilters.add(src); btn.classList.add('active'); }
      applyFilters();
    };
    el.appendChild(btn);
  }
}

function applyFilters() {
  const q = document.getElementById('search-box').value.toLowerCase().trim();
  filteredSkills = DATA.skills.filter(s => {
    if (activeFilters.size && !activeFilters.has(sourceOf(s.id))) return false;
    if (q && !s.label.toLowerCase().includes(q) && !s.id.toLowerCase().includes(q)) return false;
    return true;
  });
  renderTable();
}

function setupSearch() {
  let debounce = null;
  document.getElementById('search-box').addEventListener('input', () => {
    clearTimeout(debounce);
    debounce = setTimeout(applyFilters, 150);
  });
}

// Virtual-scroll table
const ROW_H = 30;
let scrollTop = 0;

function renderTable() {
  const wrap = document.getElementById('table-wrap');
  const viewH = wrap.clientHeight || 600;
  const totalH = filteredSkills.length * ROW_H;

  wrap.innerHTML = '';
  const spacer = document.createElement('div');
  spacer.style.height = totalH + 'px';
  spacer.style.position = 'relative';
  wrap.appendChild(spacer);

  function renderVisible() {
    const st = wrap.scrollTop;
    const startIdx = Math.floor(st / ROW_H);
    const endIdx = Math.min(startIdx + Math.ceil(viewH / ROW_H) + 2, filteredSkills.length);

    const existing = spacer.querySelectorAll('.row');
    existing.forEach(r => r.remove());

    for (let i = startIdx; i < endIdx; i++) {
      const s = filteredSkills[i];
      const row = document.createElement('div');
      row.className = 'row' + (s.id === selectedId ? ' selected' : '');
      row.style.position = 'absolute';
      row.style.top = (i * ROW_H) + 'px';
      row.style.left = '0';
      row.style.right = '0';
      row.style.height = ROW_H + 'px';

      const src = sourceOf(s.id);
      row.innerHTML = `<span class="id" style="color:${colorOf(s.id)}">${src}<span style="color:var(--text-dim)">.${s.id.slice(src.length + 1)}</span></span><span class="label">${esc(s.label)}</span><span class="tags">${esc(s.tags)}</span>`;
      row.onclick = () => selectSkill(s.id);
      spacer.appendChild(row);
    }
  }

  wrap.onscroll = renderVisible;
  renderVisible();

  document.getElementById('table-footer').textContent =
    `${filteredSkills.length} of ${DATA.skills.length} skills`;
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Selection
let isOverview = true;
let hopCount = 2;

function selectSkill(id) {
  if (id === selectedId) { deselectSkill(); return; }
  selectedId = id;
  isOverview = false;
  document.getElementById('hop-controls').style.display = '';
  updateHopLabel();
  renderTable();
  buildGraph(id);
}

function deselectSkill() {
  selectedId = null;
  isOverview = true;
  document.getElementById('hop-controls').style.display = 'none';
  renderTable();
  showOverview();
}

function fitViewport(w, h) {
  if (!graphNodes.length) { panX = 0; panY = 0; zoom = 1; return; }
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const n of graphNodes) {
    if (n.x < minX) minX = n.x;
    if (n.y < minY) minY = n.y;
    if (n.x > maxX) maxX = n.x;
    if (n.y > maxY) maxY = n.y;
  }
  const pad = 20;
  const bw = (maxX - minX) || 1, bh = (maxY - minY) || 1;
  zoom = Math.min((w - pad * 2) / bw, (h - pad * 2) / bh, 1.0);
  panX = (w - bw * zoom) / 2 - minX * zoom;
  panY = (h - bh * zoom) / 2 - minY * zoom;
}

// Overview — force-directed layout of ALL nodes, clustering by connectivity
function showOverview() {
  simRunning = false;
  isOverview = true;
  document.getElementById('empty-state').style.display = 'none';

  const w = canvas.width / dpr;
  const h = canvas.height / dpr;

  // Only include skills that participate in at least one prereq edge
  const hasEdge = new Set();
  const adj = {};
  for (const [sid, pid] of DATA.prereqs) {
    hasEdge.add(sid);
    hasEdge.add(pid);
    if (!adj[sid]) adj[sid] = [];
    if (!adj[pid]) adj[pid] = [];
    adj[sid].push(pid);
    adj[pid].push(sid);
  }

  // Find connected components via BFS, drop tiny ones
  const compOf = {};
  const comps = [];
  const visited = new Set();
  for (const id of hasEdge) {
    if (visited.has(id)) continue;
    const comp = [];
    const queue = [id];
    visited.add(id);
    while (queue.length) {
      const cur = queue.shift();
      comp.push(cur);
      compOf[cur] = comps.length;
      for (const nb of (adj[cur] || [])) {
        if (!visited.has(nb)) { visited.add(nb); queue.push(nb); }
      }
    }
    if (comp.length >= 5) comps.push(comp);
  }

  // Layout: largest component at center, smaller ones packed around it
  comps.sort((a, b) => b.length - a.length);
  const radii = comps.map(c => Math.sqrt(c.length) * 5); // radius per component

  // Place largest component at center, rest in a spiral around it
  const compCenters = [];
  const cx = w / 2, cy = h / 2;
  if (comps.length > 0) {
    compCenters.push({ x: cx, y: cy, r: radii[0] });
    let ringR = radii[0] + 20;
    let angle = 0;
    for (let ci = 1; ci < comps.length; ci++) {
      const r = radii[ci];
      const gap = r + 10;
      // angular step sized so components don't overlap on the ring
      const step = 2 * Math.asin(Math.min(1, gap / Math.max(ringR, 1)));
      angle += step;
      if (angle > Math.PI * 2) { ringR += r * 2 + 20; angle = 0; }
      compCenters.push({ x: cx + Math.cos(angle) * ringR, y: cy + Math.sin(angle) * ringR, r });
      angle += step;
    }
  }

  // Place nodes: BFS layers within each component, spiral out from center
  graphNodes = [];
  for (let ci = 0; ci < comps.length; ci++) {
    const comp = comps[ci];
    const cc = compCenters[ci];
    const deg = {};
    for (const id of comp) deg[id] = (adj[id] || []).length;
    comp.sort((a, b) => deg[b] - deg[a]);
    const root = comp[0];
    const depth = {};
    const bfsQ = [root];
    depth[root] = 0;
    let maxD = 0;
    while (bfsQ.length) {
      const cur = bfsQ.shift();
      for (const nb of (adj[cur] || [])) {
        if (depth[nb] === undefined && hasEdge.has(nb)) {
          depth[nb] = depth[cur] + 1;
          if (depth[nb] > maxD) maxD = depth[nb];
          bfsQ.push(nb);
        }
      }
    }
    const byDepth = [];
    for (const id of comp) {
      const d = depth[id] ?? 0;
      if (!byDepth[d]) byDepth[d] = [];
      byDepth[d].push(id);
    }
    const rStep = cc.r / Math.max(maxD + 1, 1);
    for (let d = 0; d <= maxD; d++) {
      const ring = byDepth[d] || [];
      const r = d * rStep;
      for (let i = 0; i < ring.length; i++) {
        const angle = (i / ring.length) * Math.PI * 2 + d * 0.5;
        const s = skillMap[ring[i]];
        if (!s) continue;
        graphNodes.push({
          id: ring[i], label: s.label, depth: 0,
          x: cc.x + Math.cos(angle) * r + (Math.random() - 0.5) * 3,
          y: cc.y + Math.sin(angle) * r + (Math.random() - 0.5) * 3,
          vx: 0, vy: 0, pinned: false,
        });
      }
    }
  }

  graphEdges = DATA.prereqs.map(([sid, pid]) => ({ from: pid, to: sid }));

  fitViewport(w, h);

  document.getElementById('graph-title').textContent = 'all skills';
  document.getElementById('graph-info').textContent = `${graphNodes.length} nodes / ${graphEdges.length} edges`;

  updateLegend();
  startSim();
}

function updateLegend() {
  const sources = new Set(graphNodes.map(n => sourceOf(n.id)));
  const legend = document.getElementById('legend');
  legend.innerHTML = '';
  legend.classList.add('visible');
  for (const src of [...sources].sort()) {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<div class="legend-dot" style="background:${SOURCE_COLORS[src] || '#7a7e8a'}"></div>${src}`;
    legend.appendChild(item);
  }
}

// Graph — 2-hop neighborhood with force layout
function buildGraph(centerId) {
  simRunning = false;
  document.getElementById('empty-state').style.display = 'none';

  const nodes = new Map();
  const edges = [];
  const visited = new Set();

  function addNode(id, depth) {
    if (nodes.has(id)) return;
    const s = skillMap[id];
    nodes.set(id, {
      id, label: s ? s.label : id, depth,
      x: 0, y: 0, vx: 0, vy: 0,
      pinned: id === centerId,
    });
  }

  function bfs(startId, getNeighbors, maxDepth) {
    const queue = [[startId, 0]];
    visited.add(startId);
    while (queue.length) {
      const [cur, d] = queue.shift();
      addNode(cur, d);
      if (d >= maxDepth) continue;
      for (const nb of (getNeighbors(cur) || [])) {
        addNode(nb, d + 1);
        if (!visited.has(nb)) { visited.add(nb); queue.push([nb, d + 1]); }
      }
    }
  }

  visited.clear();
  bfs(centerId, id => prereqsOf[id], hopCount);
  visited.clear();
  visited.add(centerId);
  bfs(centerId, id => dependentsOf[id], hopCount);

  for (const [sid, pid] of DATA.prereqs) {
    if (nodes.has(sid) && nodes.has(pid)) {
      edges.push({ from: pid, to: sid });
    }
  }

  graphNodes = [...nodes.values()];
  graphEdges = edges;

  const cx = canvas.width / (2 * dpr);
  const cy = canvas.height / (2 * dpr);
  for (const n of graphNodes) {
    if (n.id === centerId) { n.x = cx; n.y = cy; }
    else {
      const angle = Math.random() * Math.PI * 2;
      const r = 80 + n.depth * 60 + Math.random() * 40;
      n.x = cx + Math.cos(angle) * r;
      n.y = cy + Math.sin(angle) * r;
    }
  }

  panX = 0; panY = 0; zoom = 1;

  const s = skillMap[centerId];
  document.getElementById('graph-title').textContent = s ? s.label : centerId;
  document.getElementById('graph-info').textContent = `${graphNodes.length} nodes / ${graphEdges.length} edges`;

  updateLegend();
  startSim();
}

// Canvas
let canvas, ctx, dpr;

function setupCanvas() {
  canvas = document.getElementById('canvas');
  ctx = canvas.getContext('2d');
  dpr = window.devicePixelRatio || 1;
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  canvas.addEventListener('mousemove', onCanvasMouseMove);
  canvas.addEventListener('mousedown', onCanvasMouseDown);
  canvas.addEventListener('mouseup', onCanvasMouseUp);
  canvas.addEventListener('wheel', onCanvasWheel, { passive: false });
  canvas.addEventListener('dblclick', onCanvasDblClick);

  document.getElementById('hop-minus').onclick = () => {
    if (hopCount <= 1) return;
    hopCount--;
    updateHopLabel();
    if (selectedId) buildGraph(selectedId);
  };
  document.getElementById('hop-plus').onclick = () => {
    if (hopCount >= 6) return;
    hopCount++;
    updateHopLabel();
    if (selectedId) buildGraph(selectedId);
  };
}

function updateHopLabel() {
  document.getElementById('hop-label').textContent = `${hopCount} hops`;
}

function resizeCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  canvas.width = wrap.clientWidth * dpr;
  canvas.height = wrap.clientHeight * dpr;
  canvas.style.width = wrap.clientWidth + 'px';
  canvas.style.height = wrap.clientHeight + 'px';
  draw();
}

function screenToWorld(sx, sy) {
  return { x: (sx - panX) / zoom, y: (sy - panY) / zoom };
}

function worldToScreen(wx, wy) {
  return { x: wx * zoom + panX, y: wy * zoom + panY };
}

function nodeAt(sx, sy) {
  const w = screenToWorld(sx, sy);
  const hitR = isOverview ? 6 / zoom : 9;
  for (let i = graphNodes.length - 1; i >= 0; i--) {
    const n = graphNodes[i];
    const dx = n.x - w.x, dy = n.y - w.y;
    if (dx * dx + dy * dy < hitR * hitR) return n;
  }
  return null;
}

function onCanvasMouseMove(e) {
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left, sy = e.clientY - rect.top;

  if (dragNode) {
    const w = screenToWorld(sx, sy);
    dragNode.x = w.x;
    dragNode.y = w.y;
    dragNode.vx = 0;
    dragNode.vy = 0;
    draw();
    return;
  }

  if (isPanning && lastMouse) {
    panX += (sx - lastMouse.x);
    panY += (sy - lastMouse.y);
    lastMouse = { x: sx, y: sy };
    draw();
    return;
  }

  const node = nodeAt(sx, sy);
  if (node !== hoveredNode) {
    hoveredNode = node;
    hoverFadeTarget = node ? 1 : 0;
    startHoverFade();
    canvas.style.cursor = node ? 'pointer' : 'grab';
    const tooltip = document.getElementById('tooltip');
    if (node) {
      tooltip.innerHTML = `<div>${esc(node.label)}</div><div class="tt-id">${esc(node.id)}</div>`;
      tooltip.style.display = 'block';
      tooltip.style.left = (e.clientX - document.getElementById('right').getBoundingClientRect().left + 12) + 'px';
      tooltip.style.top = (sy + 12) + 'px';
    } else {
      tooltip.style.display = 'none';
    }
  } else if (node) {
    const tooltip = document.getElementById('tooltip');
    tooltip.style.left = (e.clientX - document.getElementById('right').getBoundingClientRect().left + 12) + 'px';
    tooltip.style.top = (sy + 12) + 'px';
  }
}

function onCanvasMouseDown(e) {
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  const node = nodeAt(sx, sy);
  if (node) {
    dragNode = node;
    dragNode.pinned = true;
    canvas.style.cursor = 'grabbing';
  } else {
    isPanning = true;
    lastMouse = { x: sx, y: sy };
    canvas.style.cursor = 'grabbing';
  }
}

function onCanvasMouseUp(e) {
  if (dragNode) {
    if (dragNode.id !== selectedId) dragNode.pinned = false;
    dragNode = null;
  }
  isPanning = false;
  lastMouse = null;
  canvas.style.cursor = hoveredNode ? 'pointer' : 'grab';
}

function onCanvasWheel(e) {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  const newZoom = Math.max(0.1, Math.min(5, zoom * delta));
  panX = sx - (sx - panX) * (newZoom / zoom);
  panY = sy - (sy - panY) * (newZoom / zoom);
  zoom = newZoom;
  draw();
}

function onCanvasDblClick(e) {
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  const node = nodeAt(sx, sy);
  if (node) selectSkill(node.id);
  else if (!isOverview) deselectSkill();
}

// Simulation
function startSim() {
  if (simRunning) return;
  simRunning = true;
  let ticks = 0;
  const n = graphNodes.length;
  const large = n > 200;
  const maxTicks = large ? 300 : 200;
  const sampleSize = 50; // repulsion sample per node for large graphs
  const repK = large ? 300 : 800;
  const edgeRestLen = large ? 20 : 60;
  const edgeK = large ? 0.08 : 0.02;
  const maxV = large ? 10 : 50;

  function tick() {
    if (ticks >= maxTicks || !simRunning) { simRunning = false; draw(); return; }
    ticks++;

    const alpha = 1 - ticks / maxTicks;
    const nodeById = {};
    for (const nd of graphNodes) nodeById[nd.id] = nd;

    // Repulsion — stochastic sampling for large graphs
    if (large) {
      for (let i = 0; i < n; i++) {
        const a = graphNodes[i];
        if (a.pinned) continue;
        for (let s = 0; s < sampleSize; s++) {
          const j = (Math.random() * n) | 0;
          if (j === i) continue;
          const b = graphNodes[j];
          let dx = b.x - a.x, dy = b.y - a.y;
          let d2 = dx * dx + dy * dy;
          if (d2 < 1) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d2 = 1; }
          const f = repK * alpha / d2;
          a.vx -= dx * f;
          a.vy -= dy * f;
        }
      }
    } else {
      for (let i = 0; i < n; i++) {
        for (let j = i + 1; j < n; j++) {
          const a = graphNodes[i], b = graphNodes[j];
          let dx = b.x - a.x, dy = b.y - a.y;
          let d2 = dx * dx + dy * dy;
          if (d2 < 1) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d2 = 1; }
          const f = repK * alpha / d2;
          const fx = dx * f, fy = dy * f;
          if (!a.pinned) { a.vx -= fx; a.vy -= fy; }
          if (!b.pinned) { b.vx += fx; b.vy += fy; }
        }
      }
    }

    // Attraction along edges
    for (const e of graphEdges) {
      const a = nodeById[e.from], b = nodeById[e.to];
      if (!a || !b) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      const f = (d - edgeRestLen) * edgeK * alpha;
      const fx = (dx / d) * f, fy = (dy / d) * f;
      if (!a.pinned) { a.vx += fx; a.vy += fy; }
      if (!b.pinned) { b.vx -= fx; b.vy -= fy; }
    }

    // Gravity toward center (keeps large graphs from drifting)
    if (large) {
      const cx = canvas.width / (2 * dpr), cy = canvas.height / (2 * dpr);
      const grav = 0.05 * alpha;
      for (const nd of graphNodes) {
        if (nd.pinned) continue;
        nd.vx += (cx - nd.x) * grav;
        nd.vy += (cy - nd.y) * grav;
      }
    }

    // Apply velocity with clamping
    for (const nd of graphNodes) {
      if (nd.pinned) continue;
      nd.vx *= 0.8;
      nd.vy *= 0.8;
      const speed = Math.sqrt(nd.vx * nd.vx + nd.vy * nd.vy);
      if (speed > maxV) { nd.vx *= maxV / speed; nd.vy *= maxV / speed; }
      nd.x += nd.vx;
      nd.y += nd.vy;
    }

    draw();
    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);
}

let hoverFadeRAF = 0;
function startHoverFade() {
  if (hoverFadeRAF) return;
  lastFrameTime = performance.now();
  function fadeTick(now) {
    const dt = (now - lastFrameTime) / 1000;
    lastFrameTime = now;
    const speed = 1 / 0.1; // 0.1s transition
    if (hoverFade < hoverFadeTarget) hoverFade = Math.min(hoverFadeTarget, hoverFade + dt * speed);
    else hoverFade = Math.max(hoverFadeTarget, hoverFade - dt * speed);
    draw();
    if (Math.abs(hoverFade - hoverFadeTarget) > 0.001) {
      hoverFadeRAF = requestAnimationFrame(fadeTick);
    } else {
      hoverFade = hoverFadeTarget;
      hoverFadeRAF = 0;
    }
  }
  hoverFadeRAF = requestAnimationFrame(fadeTick);
}

function draw() {
  const w = canvas.width / dpr;
  const h = canvas.height / dpr;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  // Subtle grid
  ctx.save();
  ctx.strokeStyle = '#151620';
  ctx.lineWidth = 0.5;
  const gridSize = 40 * zoom;
  const offX = panX % gridSize, offY = panY % gridSize;
  for (let x = offX; x < w; x += gridSize) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
  }
  for (let y = offY; y < h; y += gridSize) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }
  ctx.restore();

  if (!graphNodes.length) return;

  // Build lookup
  const nodeById = {};
  for (const n of graphNodes) nodeById[n.id] = n;

  ctx.save();
  ctx.translate(panX, panY);
  ctx.scale(zoom, zoom);

  // Build edge lookup for hover highlight
  const connectedToHover = new Set();
  if (hoveredNode) {
    for (const e of graphEdges) {
      if (e.from === hoveredNode.id) connectedToHover.add(e.to);
      if (e.to === hoveredNode.id) connectedToHover.add(e.from);
    }
    connectedToHover.add(hoveredNode.id);
  }

  if (isOverview) {
    // Batched edge draw
    const edgeAlpha = 0.25 - hoverFade * 0.15;
    ctx.beginPath();
    ctx.strokeStyle = `rgba(140,150,170,${edgeAlpha})`;
    ctx.lineWidth = 0.7;
    for (const e of graphEdges) {
      const from = nodeById[e.from], to = nodeById[e.to];
      if (!from || !to) continue;
      ctx.moveTo(from.x, from.y);
      ctx.lineTo(to.x, to.y);
    }
    ctx.stroke();

    // Hovered edges on top
    if (hoverFade > 0.001 && hoveredNode) {
      const hovEdgeAlpha = 0.35 * hoverFade;
      ctx.beginPath();
      ctx.strokeStyle = `rgba(200,210,230,${hovEdgeAlpha})`;
      ctx.lineWidth = 0.8;
      for (const e of graphEdges) {
        if (e.from !== hoveredNode.id && e.to !== hoveredNode.id) continue;
        const from = nodeById[e.from], to = nodeById[e.to];
        if (!from || !to) continue;
        ctx.moveTo(from.x, from.y);
        ctx.lineTo(to.x, to.y);
      }
      ctx.stroke();
    }

    // Nodes — small dots, batched by source color
    const byColor = {};
    for (const n of graphNodes) {
      const c = colorOf(n.id);
      if (!byColor[c]) byColor[c] = [];
      byColor[c].push(n);
    }
    const nodeR = Math.max(4, Math.min(8, 14 / Math.sqrt(graphNodes.length / 500)));
    const brightAlpha = Math.round(255 - hoverFade * (255 - 0x60));
    const dimAlpha = Math.round(255 - hoverFade * (255 - 0x70));
    const brightHex = brightAlpha.toString(16).padStart(2, '0');
    const dimHex = dimAlpha.toString(16).padStart(2, '0');
    for (const [color, nodes] of Object.entries(byColor)) {
      // Connected / bright pass
      ctx.fillStyle = color + brightHex;
      ctx.beginPath();
      for (const n of nodes) {
        if (hoveredNode && !connectedToHover.has(n.id)) continue;
        ctx.moveTo(n.x + nodeR, n.y);
        ctx.arc(n.x, n.y, nodeR, 0, Math.PI * 2);
      }
      ctx.fill();
      // Dimmed pass (non-connected)
      if (hoverFade > 0.001) {
        ctx.fillStyle = color + dimHex;
        ctx.beginPath();
        for (const n of nodes) {
          if (connectedToHover.has(n.id)) continue;
          ctx.moveTo(n.x + nodeR, n.y);
          ctx.arc(n.x, n.y, nodeR, 0, Math.PI * 2);
        }
        ctx.fill();
      }
    }

    // Hovered node label
    if (hoveredNode && hoverFade > 0.001) {
      const r = 4;
      const color = colorOf(hoveredNode.id);
      ctx.beginPath();
      ctx.arc(hoveredNode.x, hoveredNode.y, r, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = `rgba(232,236,244,${hoverFade})`;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.font = '500 10px "DM Sans", sans-serif';
      ctx.fillStyle = `rgba(232,236,244,${hoverFade})`;
      ctx.textAlign = 'center';
      ctx.fillText(hoveredNode.label.length > 40 ? hoveredNode.label.slice(0, 38) + '..' : hoveredNode.label, hoveredNode.x, hoveredNode.y - r - 5);
    }

  } else {
    // Detail view — per-edge styling with arrows
    for (const e of graphEdges) {
      const from = nodeById[e.from];
      const to = nodeById[e.to];
      if (!from || !to) continue;

      const isHovered = hoveredNode && (hoveredNode.id === e.from || hoveredNode.id === e.to);
      ctx.strokeStyle = isHovered ? 'rgba(200,210,230,0.3)' : 'rgba(100,110,130,0.12)';
      ctx.lineWidth = isHovered ? 1.2 : 0.6;

      ctx.beginPath();
      ctx.moveTo(from.x, from.y);
      ctx.lineTo(to.x, to.y);
      ctx.stroke();

      // Arrow
      const dx = to.x - from.x, dy = to.y - from.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      const nx = dx / d, ny = dy / d;
      const r = to.id === selectedId ? 8 : 5;
      const ax = to.x - nx * (r + 3), ay = to.y - ny * (r + 3);
      const sz = isHovered ? 5 : 3;
      ctx.fillStyle = ctx.strokeStyle;
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(ax - nx * sz - ny * sz * 0.5, ay - ny * sz + nx * sz * 0.5);
      ctx.lineTo(ax - nx * sz + ny * sz * 0.5, ay - ny * sz - nx * sz * 0.5);
      ctx.fill();
    }

    // Nodes
    for (const n of graphNodes) {
      const isSelected = n.id === selectedId;
      const isHov = hoveredNode && n.id === hoveredNode.id;
      const isConnected = hoveredNode && connectedToHover.has(n.id);
      const dimmed = hoveredNode && !isConnected;

      const r = isSelected ? 8 : (isHov ? 7 : 5);
      const color = colorOf(n.id);

      if (isSelected) {
        ctx.beginPath();
        ctx.arc(n.x, n.y, 18, 0, Math.PI * 2);
        const grad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, 18);
        grad.addColorStop(0, color + '30');
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.fill();
      }

      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
      ctx.fillStyle = dimmed ? color + '40' : color;
      ctx.fill();

      if (isSelected || isHov) {
        ctx.strokeStyle = '#e8ecf4';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      if (isSelected || isHov || (zoom > 0.6 && graphNodes.length < 80) || (zoom > 1.0)) {
        ctx.font = `${isSelected ? '500' : '400'} ${isSelected ? 11 : 9}px "DM Sans", sans-serif`;
        ctx.fillStyle = dimmed ? 'rgba(200,210,230,0.2)' : (isSelected ? '#e8ecf4' : 'rgba(200,210,230,0.7)');
        ctx.textAlign = 'center';
        ctx.fillText(n.label.length > 30 ? n.label.slice(0, 28) + '..' : n.label, n.x, n.y - r - 5);
      }
    }
  }

  ctx.restore();
}

init();
</script>
</body>
</html>
